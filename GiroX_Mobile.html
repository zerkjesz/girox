<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Giro X — O giro certo muda o jogo</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Hanken+Grotesk:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

<style>
/* ── design tokens ────────────────────────────────────────────────── */
:root {
  --bg: #0a0907;
  --bg-2: #100e0a;
  --surface: #15130e;
  --surface-2: #1c1913;
  --surface-3: #25211a;
  --line: rgba(255,240,210,0.08);
  --line-strong: rgba(255,240,210,0.16);
  --text: #f4efe2;
  --text-soft: #d8d0bc;
  --muted: #8a8474;
  --muted-2: #5e594c;
  --accent: #ffc940;
  --accent-deep: #c8930a;
  --accent-ink: #0a0907;
  --danger: #ff6a3d;
  --serif: "Instrument Serif", "Times New Roman", serif;
  --display: "Space Grotesk", ui-sans-serif, system-ui, sans-serif;
  --sans: "Hanken Grotesk", ui-sans-serif, system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, monospace;
  --radius: 16px;
  --radius-lg: 24px;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--sans);
  font-size: 16px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
body::before {
  content: "";
  position: fixed; inset: 0;
  background:
    radial-gradient(1100px 600px at 80% -200px, rgba(255,201,64,0.10), transparent 60%),
    radial-gradient(900px 500px at -100px 30%, rgba(255,201,64,0.05), transparent 60%);
  pointer-events: none;
  z-index: 0;
}
.page { position: relative; z-index: 1; }

::selection { background: var(--accent); color: var(--accent-ink); }

a { color: inherit; text-decoration: none; }
em { font-family: var(--serif); font-style: italic; font-weight: 400; letter-spacing: 0.005em; }
strong { font-weight: 600; }

.container {
  max-width: 1280px;
  margin: 0 auto;
  padding: 0 48px;
}
@media (max-width: 900px) {
  .container { padding: 0 24px; }
}

.section {
  padding: 88px 0;
  position: relative;
}
@media (max-width: 900px) { .section { padding: 64px 0; } }

.h2 {
  font-family: var(--display);
  font-weight: 600;
  font-size: clamp(34px, 4.4vw, 60px);
  line-height: 1.02;
  letter-spacing: -0.025em;
  margin: 0 0 0.6em;
  text-wrap: balance;
}
.h2 em { font-size: 1.04em; }
.muted { color: var(--muted); }

.section-label {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  font-family: var(--mono);
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.15em;
  color: var(--muted);
  margin-bottom: 28px;
}
.section-n { color: var(--accent); }
.section-line { width: 28px; height: 1px; background: var(--line-strong); }

/* ── buttons ──────────────────────────────────────────────────────── */
.btn {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  border: 1px solid transparent;
  border-radius: 999px;
  font-family: var(--sans);
  font-weight: 600;
  cursor: pointer;
  transition: transform 0.15s ease, background 0.2s, border-color 0.2s, color 0.2s;
  white-space: nowrap;
  text-decoration: none;
  letter-spacing: -0.005em;
}
.btn:hover { transform: translateY(-1px); }
.btn-sm { padding: 8px 16px; font-size: 13px; }
.btn-lg { padding: 16px 26px; font-size: 16px; }
.btn-xl { padding: 22px 34px; font-size: 18px; }
.btn-full { width: 100%; justify-content: center; }
.btn-primary {
  background: var(--accent);
  color: var(--accent-ink);
  border-color: var(--accent);
  box-shadow: 0 0 0 0 rgba(212,255,58,0.0);
}
.btn-primary:hover {
  background: var(--accent-deep);
  border-color: var(--accent-deep);
  box-shadow: 0 8px 28px -8px rgba(212,255,58,0.5);
}
.btn-ghost {
  background: transparent;
  color: var(--text);
  border-color: var(--line-strong);
}
.btn-ghost:hover {
  background: var(--surface-2);
  border-color: var(--muted);
}
.link-muted { color: var(--muted); font-size: 14px; }
.link-muted:hover { color: var(--text); }

/* ── nav ──────────────────────────────────────────────────────────── */
.nav {
  position: sticky;
  top: 0;
  z-index: 100;
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  background: rgba(10,9,7,0.65);
  border-bottom: 1px solid var(--line);
}
.nav-inner {
  max-width: 1280px;
  margin: 0 auto;
  padding: 16px 48px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 24px;
}
@media (max-width: 900px) { .nav-inner { padding: 14px 24px; } }
.logo {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  font-family: var(--display);
  font-weight: 600;
  font-size: 18px;
  letter-spacing: -0.01em;
}
.logo em { color: var(--accent); font-size: 22px; line-height: 1; }
.logo-mark { color: var(--accent); display: inline-flex; }
.logo-img {
  padding: 0;
  gap: 10px;
}
.logo-img .logo-mark-img {
  height: 36px;
  width: auto;
  display: block;
}
.logo-img .logo-word-img {
  height: 22px;
  width: auto;
  display: block;
}
.logo-img-sm .logo-mark-img { height: 32px; }
.logo-img-sm .logo-word-img { height: 20px; }
.logo-footer .logo-word-img { height: 40px; }
.nav-links {
  display: flex;
  gap: 28px;
  font-size: 14px;
}
.nav-links a { color: var(--text-soft); transition: color 0.2s; white-space: nowrap; }
.nav-links a:hover { color: var(--accent); }
.nav-cta { display: flex; align-items: center; gap: 20px; }
@media (max-width: 760px) {
  .nav-links { display: none; }
  .nav-cta .link-muted { display: none; }
}

/* ── HERO (centered, slim) ─────────────────────────────────── */
.hero {
  padding: 88px 0 72px;
  position: relative;
  overflow: hidden;
}
.hero::before {
  content: "";
  position: absolute;
  top: -120px; left: 50%;
  transform: translateX(-50%);
  width: 1000px; height: 700px;
  background: radial-gradient(ellipse at center, rgba(255,201,64,0.10), transparent 60%);
  pointer-events: none;
  z-index: 0;
}
.hero-inner {
  position: relative;
  z-index: 1;
  text-align: center;
  max-width: 920px;
  margin: 0 auto;
}

.display {
  font-family: var(--display);
  font-weight: 600;
  font-size: clamp(40px, 5.4vw, 72px);
  line-height: 0.98;
  letter-spacing: -0.035em;
  margin: 0 0 28px;
  text-wrap: balance;
}
.display em {
  font-size: 1.05em;
  color: var(--accent);
}
.hl-soft { color: var(--muted); font-family: var(--display); font-weight: 500; }

.lede {
  font-size: 19px;
  line-height: 1.5;
  color: var(--text-soft);
  max-width: 600px;
  margin: 0 auto 36px;
  text-wrap: balance;
}

.cta-row {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  justify-content: center;
  margin-bottom: 48px;
}
.cta-sub {
  font-family: var(--mono);
  font-size: 11.5px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--muted);
  margin: 0;
}

.hero-stats {
  display: flex;
  gap: 32px;
  align-items: stretch;
  padding-top: 32px;
  border-top: 1px solid var(--line);
  max-width: 640px;
  margin: 0 auto;
  justify-content: center;
}
.stat { text-align: left; }
.stat-num {
  font-family: var(--display);
  font-weight: 600;
  font-size: 36px;
  letter-spacing: -0.03em;
  line-height: 1;
  color: var(--text);
  font-variant-numeric: tabular-nums;
}
.stat-unit { font-size: 16px; color: var(--muted); margin-left: 4px; }
.stat-lbl {
  font-size: 12px;
  color: var(--muted);
  line-height: 1.35;
  margin-top: 8px;
}
.divider-v { width: 1px; background: var(--line); }
/* keep pulse keyframe for elements outside hero */
@keyframes pulse {
  0%,100% { opacity: 1; }
  50% { opacity: 0.45; }
}

/* marquee removed */

/* removed unused vp-grid (section merged into solution) */

.vp-callout {
  margin-top: 32px;
  padding: 24px 28px;
  border-left: 2px solid var(--accent);
  background: linear-gradient(90deg, rgba(255,201,64,0.06), transparent);
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.vp-cross {
  font-family: var(--display);
  font-size: 22px;
  color: var(--muted);
  text-decoration: line-through;
  text-decoration-color: rgba(255,106,61,0.55);
  text-decoration-thickness: 2px;
}
.vp-real {
  font-family: var(--display);
  font-size: 26px;
  font-weight: 600;
  color: var(--text);
  letter-spacing: -0.015em;
}

/* ── pain ─────────────────────────────────────────────────────────── */
.pain { background: var(--bg-2); }
.pain-h em { color: var(--accent); }
.pain-grid {
  margin-top: 56px;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 16px;
}
@media (max-width: 900px) { .pain-grid { grid-template-columns: 1fr; } }

.pain-card {
  position: relative;
  background:
    linear-gradient(180deg, rgba(255,201,64,0.04), transparent 40%),
    var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 24px 24px 22px;
  display: flex;
  flex-direction: column;
  gap: 16px;
  overflow: hidden;
  transition: border-color 0.3s, transform 0.3s, background 0.3s;
}
.pain-card::before {
  content: "";
  position: absolute;
  top: 0; left: 0;
  width: 0;
  height: 2px;
  background: var(--accent);
  transition: width 0.4s ease;
}
.pain-card:hover {
  border-color: var(--line-strong);
  transform: translateY(-3px);
  background:
    linear-gradient(180deg, rgba(255,201,64,0.07), transparent 50%),
    var(--surface);
}
.pain-card:hover::before { width: 100%; }
.pain-card:hover .pain-arrow { transform: translateX(4px); }
.pain-card:hover .pain-spark { color: var(--accent); transform: rotate(45deg); }

.pain-card-top {
  display: flex;
  align-items: center;
  gap: 10px;
}
.pain-n {
  font-family: var(--mono);
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.12em;
  color: var(--accent);
}
.pain-cat {
  flex: 1;
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--muted);
}
.pain-spark {
  color: var(--muted-2);
  display: inline-flex;
  transition: color 0.3s, transform 0.3s;
}

.pain-quote-text {
  font-family: var(--serif);
  font-style: italic;
  font-size: 22px;
  line-height: 1.25;
  color: var(--text);
  margin: 4px 0 0;
  letter-spacing: 0.005em;
  text-wrap: balance;
  min-height: 84px;
}

.pain-divider {
  height: 1px;
  background: repeating-linear-gradient(90deg, var(--line-strong) 0 4px, transparent 4px 10px);
  margin: 4px -8px 0;
}

.pain-solved {
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.pain-solved-lbl {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-family: var(--mono);
  font-size: 10.5px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--accent);
}
.pain-arrow {
  display: inline-block;
  transition: transform 0.3s;
  font-family: var(--sans);
}
.pain-solved-text {
  font-family: var(--sans);
  font-size: 14.5px;
  font-weight: 500;
  color: var(--text-soft);
  line-height: 1.4;
}

/* ── solution ─────────────────────────────────────────────────────── */
.sol-grid {
  display: grid;
  grid-template-columns: 1.05fr 1fr;
  gap: 80px;
  align-items: start;
}
@media (max-width: 900px) { .sol-grid { grid-template-columns: 1fr; gap: 40px; } }
.sol-left .h2 em { color: var(--accent); }
.sol-p {
  font-size: 18px;
  line-height: 1.6;
  color: var(--text-soft);
  margin: 0 0 24px;
  max-width: 520px;
}
.sol-p strong { color: var(--text); }
.sol-mech {
  padding: 20px 24px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  margin-top: 32px;
}
.mech-tag {
  display: block;
  font-family: var(--mono);
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.14em;
  color: var(--accent);
  margin-bottom: 10px;
}
.sol-mech em { color: var(--text); }

.sol-card {
  background: linear-gradient(180deg, var(--surface-2), var(--surface));
  border: 1px solid var(--line-strong);
  border-radius: var(--radius-lg);
  padding: 32px;
  position: relative;
}
.sol-card::before {
  content: "";
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--accent), transparent);
  opacity: 0.5;
}
.sol-card-hd {
  font-family: var(--mono);
  font-size: 12px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--accent);
  margin-bottom: 24px;
}
.sol-list { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 22px; }
.sol-list li { display: flex; gap: 16px; align-items: flex-start; }
.sol-list strong {
  display: block;
  font-family: var(--display);
  font-size: 18px;
  font-weight: 600;
  margin-bottom: 4px;
  letter-spacing: -0.01em;
}
.sol-list span {
  font-size: 14.5px;
  color: var(--muted);
  line-height: 1.5;
}
.li-tick {
  flex: 0 0 28px;
  width: 28px; height: 28px;
  background: var(--accent);
  color: var(--accent-ink);
  border-radius: 50%;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  margin-top: 2px;
}

/* ── benefits ─────────────────────────────────────────────────────── */
.ben-grid {
  margin-top: 48px;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 1px;
  background: var(--line);
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  overflow: hidden;
}
@media (max-width: 1000px) { .ben-grid { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 640px) { .ben-grid { grid-template-columns: 1fr; } }
.ben-card {
  background: var(--bg);
  padding: 32px 28px 36px;
  transition: background 0.3s;
  position: relative;
  min-height: 260px;
  display: flex;
  flex-direction: column;
}
.ben-card:hover { background: var(--surface); }
.ben-card:hover .ben-n { color: var(--accent); }
.ben-n {
  font-family: var(--mono);
  font-size: 12px;
  letter-spacing: 0.16em;
  color: var(--muted);
  margin-bottom: auto;
  transition: color 0.2s;
}
.ben-t {
  font-family: var(--display);
  font-size: 22px;
  font-weight: 600;
  letter-spacing: -0.02em;
  margin: 28px 0 12px;
  line-height: 1.15;
}
.ben-d {
  font-size: 14.5px;
  color: var(--muted);
  line-height: 1.55;
  margin: 0;
}

/* ── live feed ────────────────────────────────────────────────────── */
.feed { background: var(--bg-2); }
.feed-grid {
  display: grid;
  grid-template-columns: 1fr 1.25fr;
  gap: 80px;
  align-items: center;
}
@media (max-width: 1000px) { .feed-grid { grid-template-columns: 1fr; gap: 40px; } }
.feed-side .h2 em { color: var(--accent); }
.feed-p {
  font-size: 17px;
  line-height: 1.55;
  color: var(--text-soft);
  max-width: 440px;
  margin: 0 0 28px;
}
.feed-legend {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  padding: 8px 14px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 999px;
  font-family: var(--mono);
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  color: var(--muted);
}
.legend-pulse {
  position: relative;
  width: 8px; height: 8px;
}
.legend-pulse span {
  position: absolute;
  inset: 0;
  background: var(--accent);
  border-radius: 50%;
  animation: pulse 1.5s ease-in-out infinite;
}
.legend-pulse::before {
  content: "";
  position: absolute;
  inset: -3px;
  border-radius: 50%;
  border: 1px solid var(--accent);
  animation: ping 1.5s ease-out infinite;
}
@keyframes ping {
  0% { transform: scale(0.6); opacity: 1; }
  100% { transform: scale(1.6); opacity: 0; }
}

.feed-card {
  background: var(--surface);
  border: 1px solid var(--line-strong);
  border-radius: var(--radius-lg);
  overflow: hidden;
  box-shadow: 0 24px 60px rgba(0,0,0,0.4);
}
.feed-hd {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 16px 24px;
  background: var(--surface-2);
  border-bottom: 1px solid var(--line);
}
.feed-title {
  font-family: var(--mono);
  font-size: 13px;
  color: var(--accent);
  letter-spacing: 0.02em;
}
.feed-meta {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--muted);
  letter-spacing: 0.08em;
}
.feed-list {
  padding: 8px;
  display: flex;
  flex-direction: column;
  gap: 2px;
  max-height: 480px;
  overflow: hidden;
}
.feed-row {
  padding: 16px 18px;
  border-radius: 10px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  transition: background 0.3s;
}
.feed-row.new {
  background: rgba(212,255,58,0.06);
  animation: rowIn 0.5s ease-out;
}
@keyframes rowIn {
  from { opacity: 0; transform: translateY(-8px); }
  to { opacity: 1; transform: translateY(0); }
}
.feed-row-top { display: flex; justify-content: space-between; align-items: center; }
.tag {
  font-family: var(--mono);
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.12em;
  padding: 4px 8px;
  border-radius: 4px;
  background: var(--surface-3);
  color: var(--text-soft);
  border: 1px solid var(--line-strong);
}
.feed-margin {
  font-family: var(--display);
  font-weight: 700;
  font-size: 15px;
  color: var(--accent);
  font-variant-numeric: tabular-nums;
}
.feed-prod {
  font-family: var(--display);
  font-size: 16px;
  font-weight: 500;
  color: var(--text);
  letter-spacing: -0.005em;
}
.feed-note {
  font-size: 13px;
  color: var(--muted);
  line-height: 1.45;
}

/* ── social proof ─────────────────────────────────────────────────── */
.proof-top {
  display: flex;
  align-items: baseline;
  gap: 20px;
  margin-bottom: 56px;
  padding-bottom: 40px;
  border-bottom: 1px solid var(--line);
}
.proof-big {
  font-family: var(--display);
  font-weight: 700;
  font-size: clamp(80px, 12vw, 168px);
  line-height: 0.9;
  letter-spacing: -0.05em;
  color: var(--accent);
  background: linear-gradient(180deg, var(--accent), var(--accent-deep));
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
}
.proof-big-lbl {
  font-family: var(--display);
  font-size: 22px;
  font-weight: 500;
  color: var(--text-soft);
  letter-spacing: -0.01em;
  max-width: 320px;
  line-height: 1.2;
}

.proof-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 20px;
}
@media (max-width: 900px) { .proof-grid { grid-template-columns: 1fr; } }
.proof-card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 24px;
  display: flex;
  flex-direction: column;
  gap: 16px;
  transition: border-color 0.3s;
}
.proof-card:hover { border-color: var(--line-strong); }
.proof-focus {
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.14em;
  color: var(--accent);
  text-transform: uppercase;
}
.proof-h {
  font-family: var(--display);
  font-size: 20px;
  font-weight: 600;
  letter-spacing: -0.015em;
  line-height: 1.15;
}
.proof-shot {
  aspect-ratio: 16/10;

  content: "";

}

/* ── faq ──────────────────────────────────────────────────────────── */

/* ── MENU HAMBÚRGUER ─────────────────────────────────────── */
.nav-hamburger {
  display: none;
  flex-direction: column;
  justify-content: center;
  gap: 5px;
  width: 40px;
  height: 40px;
  background: transparent;
  border: 1px solid var(--line-strong);
  border-radius: 8px;
  cursor: pointer;
  padding: 8px;
  transition: border-color 0.2s, background 0.2s;
}
.nav-hamburger:hover {
  background: var(--surface);
  border-color: var(--muted);
}
.nav-hamburger span {
  display: block;
  height: 1.5px;
  background: var(--text);
  border-radius: 2px;
  transition: transform 0.3s, opacity 0.3s;
  transform-origin: center;
